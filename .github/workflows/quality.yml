name: Quality

# CI validates documentation and commit-message format. It does not authorize a
# push, promotion to main, a tag, or a GitHub Release; those remain owner decisions.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation and links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run documentation checks
        run: python3 scripts/check_docs.py

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commits in this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi
          bash scripts/check-commit-range.sh "$BASE_SHA" "$HEAD_SHA"

# Rust formatting, linting, and tests will be added when the workspace lands in
# Stage 01. The jobs above are intentionally dependency-free.
