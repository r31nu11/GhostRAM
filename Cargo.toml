[workspace]
resolver = "3"
members = [
    "crates/ghostram-core",
    "crates/ghostram-models",
    "crates/ghostram-probe",
    "crates/ghostram-cli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
authors = ["r31nu11 <r31nu11@mail.ru>"]
license = "Apache-2.0"
repository = "https://github.com/r31nu11/GhostRAM"
homepage = "https://github.com/r31nu11/GhostRAM"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
ghostram-core = { path = "crates/ghostram-core" }
ghostram-models = { path = "crates/ghostram-models" }
ghostram-probe = { path = "crates/ghostram-probe" }
